name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

      - name: Rebuild and restart containers
        working-directory: docker
        run: docker compose --env-file ../.env up -d --build
